<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Picture Arrangement Study</title>

  <!-- Load jsPsych LOCALLY -->
  <script src="jspsych/jspsych.js"></script>
  <link href="jspsych/jspsych.css" rel="stylesheet" />

  <!-- Plugins -->
  <script src="jspsych/plugin-preload.js"></script>
  <script src="jspsych/plugin-html-button-response.js"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>

  <style>
    /* ---------- Page locked to viewport; no scrolling ---------- */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    #jspsych-target {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f5f5f5;
    }

    .jspsych-display-element {
      width: 100%;
      height: 100%;
    }

    .jspsych-content-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* No fixed width/height here — content must size itself so
       fitContentToViewport() can measure and scale it. */
    .jspsych-content {
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box;
    }

    .jspsych-html-button-response-stimulus {
      display: block !important;
      max-width: 900px;
      margin: 0 auto 24px auto !important;
      padding: 0 20px;
      text-align: center;
      box-sizing: border-box;
    }

    .jspsych-html-button-response-button {
      display: block !important;
      width: 100%;
      margin: 0 auto !important;
      text-align: center;
    }

    /* ---------- One font family everywhere ----------
       jspsych.css sets Open Sans on .jspsych-display-element; this overrides it. */
    .jspsych-display-element,
    .jspsych-display-element * {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ---------- One shared style for EVERY button ----------
       Uses a plain element selector so it applies whether or not a button
       carries a class. Do NOT add `display: ... !important` here — the
       grid's Continue button relies on inline `display:none` to stay hidden
       until all pictures are placed. */
    .jspsych-display-element button {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      padding: 10px 28px;
      border-radius: 10px;
      border: 1px solid #999;
      background: white;
      color: #333;
      cursor: pointer;
      line-height: 1.2;
    }

    .jspsych-display-element button:active {
      background: #f0f0f0;
    }

    .jspsych-display-element button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* jsPsych's own buttons still need this to lay out correctly */
    .jspsych-html-button-response-button button {
      display: inline-block !important;
    }

    .jspsych-content:has(.jspsych-html-button-response-stimulus) {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* ---------- Grid task ---------- */
    .stim-img {
      position: absolute;
      object-fit: contain;
      transform: translate(-50%, -50%);
      touch-action: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    .stim-img.dragging {
      z-index: 9999;
    }

    .grid-line-v,
    .grid-line-h {
      position: absolute;
      background: #cfcfcf;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="jspsych-target"></div>

  <script src="experiment.js?v=55"></script>
</body>
</html>
